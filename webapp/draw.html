<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>绘图工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #fafafa;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        /* 顶部工具栏 */
        .toolbar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 16px;
            background: white;
            border-bottom: 1px solid #e0e0e0;
            flex-shrink: 0;
        }
        
        .toolbar-section {
            display: flex;
            gap: 4px;
            padding: 0 8px;
            border-right: 1px solid #e0e0e0;
        }
        
        .toolbar-section:last-child {
            border-right: none;
        }
        
        .tool-btn {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            cursor: pointer;
            font-size: 18px;
            transition: all 0.15s;
            user-select: none;
        }
        
        .tool-btn:hover {
            background: #f5f5f5;
            border-color: #999;
        }
        
        .tool-btn.active {
            background: #2196F3;
            color: white;
            border-color: #2196F3;
        }
        
        /* 颜色选择器 */
        .color-picker {
            width: 36px;
            height: 36px;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            cursor: pointer;
            overflow: hidden;
        }
        
        .color-picker input {
            width: 100%;
            height: 100%;
            border: none;
            cursor: pointer;
        }
        
        /* 滑块控件 */
        .slider-control {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .slider-control input[type="range"] {
            width: 80px;
            height: 4px;
            -webkit-appearance: none;
            appearance: none;
            background: #e0e0e0;
            border-radius: 2px;
            outline: none;
        }
        
        .slider-control input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            background: #2196F3;
            border-radius: 50%;
            cursor: pointer;
        }
        
        .slider-control input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            background: #2196F3;
            border-radius: 50%;
            cursor: pointer;
            border: none;
        }
        
        .slider-label {
            font-size: 12px;
            color: #666;
            min-width: 30px;
        }
        
        /* 画布区域 */
        .canvas-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: #fafafa;
        }
        
        canvas {
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            cursor: crosshair;
            background: white;
        }
        
        /* 复选框样式 */
        .checkbox-control {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: #666;
            cursor: pointer;
            user-select: none;
        }
        
        .checkbox-control input[type="checkbox"] {
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="toolbar">
        <!-- 工具选择 -->
        <div class="toolbar-section">
            <button class="tool-btn active" data-tool="select" title="选择 (1)">👆</button>
            <button class="tool-btn" data-tool="point" title="点 (2)">⚫</button>
            <button class="tool-btn" data-tool="line" title="线 (3)">📏</button>
            <button class="tool-btn" data-tool="rect" title="矩形 (4)">▭</button>
            <button class="tool-btn" data-tool="circle" title="圆形 (5)">⭕</button>
            <button class="tool-btn" data-tool="polygon" title="多边形 (6)">⬡</button>
            <button class="tool-btn" data-tool="brush" title="画笔 (7)">🖌️</button>
            <button class="tool-btn" data-tool="eraser" title="橡皮擦 (8)">🧹</button>
        </div>
        
        <!-- 颜色控制 -->
        <div class="toolbar-section">
            <div class="color-picker" title="描边颜色">
                <input type="color" id="stroke-color" value="#000000">
            </div>
            <div class="color-picker" title="填充颜色">
                <input type="color" id="fill-color" value="#ffffff">
            </div>
            <label class="checkbox-control">
                <input type="checkbox" id="fill-transparent" checked>
                <span>透明</span>
            </label>
        </div>
        
        <!-- 线宽控制 -->
        <div class="toolbar-section">
            <div class="slider-control">
                <span class="slider-label" id="width-value">2px</span>
                <input type="range" id="stroke-width" min="1" max="20" value="2" title="线宽">
            </div>
        </div>
        
        <!-- 操作按钮 -->
        <div class="toolbar-section">
            <button class="tool-btn" id="btn-undo" title="撤销 (Ctrl+Z)">↩️</button>
            <button class="tool-btn" id="btn-redo" title="重做 (Ctrl+Y)">↪️</button>
            <button class="tool-btn" id="btn-clear" title="清空">🗑️</button>
        </div>
        
        <!-- 视图控制 -->
        <div class="toolbar-section">
            <label class="checkbox-control">
                <input type="checkbox" id="grid-toggle">
                <span>网格</span>
            </label>
            <button class="tool-btn" id="btn-export" title="导出PNG (Ctrl+E)">💾</button>
        </div>
    </div>
    
    <div class="canvas-container">
        <canvas id="draw-canvas" width="1200" height="700"></canvas>
    </div>

    <script type="module">
        import { CanvasManager } from './scripts/core/canvas.js';
        import { Document } from './scripts/core/document.js';
        import { SelectTool } from './scripts/tools/select.js';
        import { PointTool } from './scripts/tools/point.js';
        import { LineTool } from './scripts/tools/line.js';
        import { RectTool } from './scripts/tools/rect.js';
        import { CircleTool } from './scripts/tools/circle.js';
        import { PolygonTool } from './scripts/tools/polygon.js';
        import { BrushTool } from './scripts/tools/brush.js';
        import { EraserTool } from './scripts/tools/eraser.js';

        // 初始化
        const canvas = document.getElementById('draw-canvas');
        const canvasManager = new CanvasManager(canvas);
        const doc = new Document(canvasManager);

        // 当前样式
        let currentStyle = {
            strokeColor: '#000000',
            fillColor: 'transparent',
            strokeWidth: 2,
            opacity: 1.0
        };

        // 注册工具
        const tools = new Map();
        
        const selectTool = new SelectTool();
        selectTool.setDocument(doc);
        selectTool.on('shapeMoving', () => canvasManager.requestRender());
        selectTool.on('shapeMoved', () => doc.saveState());
        selectTool.on('shapeSelected', (data) => {
            const props = data.properties;
            if (props.strokeColor) {
                document.getElementById('stroke-color').value = props.strokeColor;
                currentStyle.strokeColor = props.strokeColor;
            }
            if (props.fillColor) {
                const transparentCheckbox = document.getElementById('fill-transparent');
                if (props.fillColor === 'transparent') {
                    transparentCheckbox.checked = true;
                    document.getElementById('fill-color').value = '#ffffff';
                } else {
                    transparentCheckbox.checked = false;
                    document.getElementById('fill-color').value = props.fillColor;
                }
                currentStyle.fillColor = props.fillColor;
            }
            if (props.strokeWidth !== undefined) {
                document.getElementById('stroke-width').value = props.strokeWidth;
                document.getElementById('width-value').textContent = props.strokeWidth + 'px';
                currentStyle.strokeWidth = props.strokeWidth;
            }
        });
        tools.set('select', selectTool);

        const pointTool = new PointTool();
        pointTool.setStyle(currentStyle);
        pointTool.on('shapeCreated', (data) => doc.addShape(data.shape));
        tools.set('point', pointTool);

        const lineTool = new LineTool();
        lineTool.setStyle(currentStyle);
        lineTool.on('shapeCreated', (data) => doc.addShape(data.shape));
        tools.set('line', lineTool);

        const rectTool = new RectTool();
        rectTool.setStyle(currentStyle);
        rectTool.on('shapeCreated', (data) => doc.addShape(data.shape));
        tools.set('rect', rectTool);

        const circleTool = new CircleTool();
        circleTool.setStyle(currentStyle);
        circleTool.on('shapeCreated', (data) => doc.addShape(data.shape));
        tools.set('circle', circleTool);

        const polygonTool = new PolygonTool();
        polygonTool.setStyle(currentStyle);
        polygonTool.on('shapeCreated', (data) => doc.addShape(data.shape));
        tools.set('polygon', polygonTool);

        const brushTool = new BrushTool();
        brushTool.setStyle(currentStyle);
        brushTool.on('shapeCreated', (data) => doc.addShape(data.shape));
        tools.set('brush', brushTool);

        const eraserTool = new EraserTool();
        eraserTool.setDocument(doc);
        tools.set('eraser', eraserTool);

        // 监听文档变化
        doc.on('shapesChanged', (data) => canvasManager.setShapes(data.shapes));

        // 设置默认工具
        let currentTool = tools.get('select');
        canvasManager.setTool(currentTool);

        // 工具按钮事件
        document.querySelectorAll('.tool-btn[data-tool]').forEach(btn => {
            btn.addEventListener('click', () => {
                const toolName = btn.dataset.tool;
                currentTool = tools.get(toolName);
                if (currentTool) {
                    if (toolName !== 'select') {
                        doc.deselectAll();
                        canvasManager.requestRender();
                    }
                    canvasManager.setTool(currentTool);
                    if (currentTool.setStyle) {
                        currentTool.setStyle(currentStyle);
                    }
                    document.querySelectorAll('.tool-btn[data-tool]').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                }
            });
        });

        // 样式控件
        document.getElementById('stroke-color').addEventListener('change', (e) => {
            currentStyle.strokeColor = e.target.value;
            if (currentTool && currentTool.setStyle) {
                currentTool.setStyle(currentStyle);
            }
            if (currentTool === selectTool) {
                const selectedShapes = doc.getSelectedShapes();
                if (selectedShapes.length > 0) {
                    selectedShapes.forEach(shape => shape.setStrokeColor(e.target.value));
                    canvasManager.requestRender();
                    doc.saveState();
                }
            }
        });

        document.getElementById('fill-color').addEventListener('change', (e) => {
            const transparentCheckbox = document.getElementById('fill-transparent');
            if (transparentCheckbox.checked) {
                transparentCheckbox.checked = false;
            }
            currentStyle.fillColor = e.target.value;
            if (currentTool && currentTool.setStyle) {
                currentTool.setStyle(currentStyle);
            }
            if (currentTool === selectTool) {
                const selectedShapes = doc.getSelectedShapes();
                if (selectedShapes.length > 0) {
                    selectedShapes.forEach(shape => shape.setFillColor(e.target.value));
                    canvasManager.requestRender();
                    doc.saveState();
                }
            }
        });

        document.getElementById('fill-transparent').addEventListener('change', (e) => {
            currentStyle.fillColor = e.target.checked ? 'transparent' : document.getElementById('fill-color').value;
            if (currentTool && currentTool.setStyle) {
                currentTool.setStyle(currentStyle);
            }
            if (currentTool === selectTool) {
                const selectedShapes = doc.getSelectedShapes();
                if (selectedShapes.length > 0) {
                    selectedShapes.forEach(shape => shape.setFillColor(currentStyle.fillColor));
                    canvasManager.requestRender();
                    doc.saveState();
                }
            }
        });

        let strokeWidthChanging = false;
        document.getElementById('stroke-width').addEventListener('input', (e) => {
            const newWidth = parseInt(e.target.value);
            currentStyle.strokeWidth = newWidth;
            document.getElementById('width-value').textContent = newWidth + 'px';
            if (currentTool && currentTool.setStyle) {
                currentTool.setStyle(currentStyle);
            }
            if (currentTool === selectTool) {
                const selectedShapes = doc.getSelectedShapes();
                if (selectedShapes.length > 0) {
                    if (!strokeWidthChanging) {
                        strokeWidthChanging = true;
                    }
                    selectedShapes.forEach(shape => shape.setStrokeWidth(newWidth));
                    canvasManager.requestRender();
                }
            }
        });

        document.getElementById('stroke-width').addEventListener('change', () => {
            if (currentTool === selectTool && strokeWidthChanging) {
                doc.saveState();
                strokeWidthChanging = false;
            }
        });

        // 控制按钮
        document.getElementById('btn-undo').addEventListener('click', () => doc.undo());
        document.getElementById('btn-redo').addEventListener('click', () => doc.redo());
        document.getElementById('btn-clear').addEventListener('click', () => {
            if (confirm('确定要清空所有图形吗？')) {
                doc.clearShapes();
            }
        });
        document.getElementById('btn-export').addEventListener('click', () => {
            const dataURL = doc.exportPNG();
            const link = document.createElement('a');
            link.download = `drawing_${Date.now()}.png`;
            link.href = dataURL;
            link.click();
        });
        document.getElementById('grid-toggle').addEventListener('change', () => canvasManager.toggleGrid());

        // 键盘快捷键
        document.addEventListener('keydown', (e) => {
            const isMac = navigator.platform.toUpperCase().indexOf('MAC') >= 0;
            const modifierKey = isMac ? e.metaKey : e.ctrlKey;
            
            if (modifierKey && e.key === 'z' && !e.shiftKey) {
                e.preventDefault();
                doc.undo();
            } else if ((modifierKey && e.key === 'z' && e.shiftKey) || (modifierKey && e.key === 'y')) {
                e.preventDefault();
                doc.redo();
            } else if (modifierKey && e.key === 'e') {
                e.preventDefault();
                const dataURL = doc.exportPNG();
                const link = document.createElement('a');
                link.download = `drawing_${Date.now()}.png`;
                link.href = dataURL;
                link.click();
            } else if (e.key === 'Delete' || e.key === 'Backspace') {
                const selectedShapes = doc.getSelectedShapes();
                if (selectedShapes.length > 0) {
                    e.preventDefault();
                    selectedShapes.forEach(shape => doc.removeShape(shape));
                    doc.saveState();
                }
            } else if (e.key === 'Escape') {
                if (currentTool && typeof currentTool.cancel === 'function') {
                    currentTool.cancel();
                }
                doc.deselectAll();
                canvasManager.requestRender();
            } else if (modifierKey && e.key === '0') {
                e.preventDefault();
                canvasManager.resetView();
            } else if (modifierKey && (e.key === '=' || e.key === '+')) {
                e.preventDefault();
                canvasManager.zoomIn();
            } else if (modifierKey && e.key === '-') {
                e.preventDefault();
                canvasManager.zoomOut();
            }
            
            // 工具快捷键
            const toolKeys = {
                '1': 'select', '2': 'point', '3': 'line', '4': 'rect',
                '5': 'circle', '6': 'polygon', '7': 'brush', '8': 'eraser'
            };
            
            if (toolKeys[e.key] && !modifierKey) {
                e.preventDefault();
                const toolName = toolKeys[e.key];
                currentTool = tools.get(toolName);
                if (currentTool) {
                    if (toolName !== 'select') {
                        doc.deselectAll();
                        canvasManager.requestRender();
                    }
                    canvasManager.setTool(currentTool);
                    if (currentTool.setStyle) {
                        currentTool.setStyle(currentStyle);
                    }
                    document.querySelectorAll('.tool-btn[data-tool]').forEach(btn => {
                        btn.classList.toggle('active', btn.dataset.tool === toolName);
                    });
                }
            }
        });
    </script>
</body>
</html>
