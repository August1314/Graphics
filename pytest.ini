[pytest]
# 测试路径
testpaths = tests

# 测试文件、类、函数的命名模式
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 额外的命令行选项
addopts = 
    --verbose
    --strict-markers
    --tb=short
    # 代码覆盖率（需要安装 pytest-cov）
    # --cov=app
    # --cov-report=html
    # --cov-report=term-missing
    # --cov-fail-under=60

# 标记定义
markers =
    unit: 单元测试
    integration: 集成测试
    ui: UI测试
    slow: 慢速测试
    
# 日志配置
log_cli = false
log_cli_level = INFO
log_file = tests.log
log_file_level = DEBUG
